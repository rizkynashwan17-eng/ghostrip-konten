name: Halaman Posting (GitHub Pages)
on:
  push:
    branches: [main]
    paths: ["index.html", "posting/**", "media/**", "assets/**", ".github/workflows/pages.yml"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.d.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Siapkan isi halaman
        run: |
          mkdir -p _site
          cp index.html .nojekyll _site/ 2>/dev/null || cp index.html _site/
          cp -r posting assets media _site/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: d
        uses: actions/deploy-pages@v4
