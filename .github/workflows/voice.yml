name: Buat suara (Gemini TTS)
on:
  push:
    paths: ["voice/requests/**.json"]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: voice
  cancel-in-progress: false
jobs:
  tts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Generate voice lines
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python3 engine/tts_gemini.py || echo "TTS belum lengkap (kuota?)"
      - name: Dengar & cocokkan dengan naskah (Gemini)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          set +e
          python3 engine/dengar_gemini.py; c=$?
          if [ "$c" = "3" ]; then
            python3 engine/tts_gemini.py
            python3 engine/dengar_gemini.py; c=$?
            if [ "$c" = "3" ]; then python3 engine/tts_gemini.py; python3 engine/dengar_gemini.py; fi
          fi
          exit 0
      - name: Commit audio
        if: always()
        run: |
          git config user.name "ghostrip-bot"
          git config user.email "bot@users.noreply.github.com"
          git add -f voice/out
          git diff --cached --quiet && echo "nothing new" && exit 0
          git commit -m "Suara baru (Gemini TTS)"
          for i in 1 2 3; do git pull --rebase origin main && git push && break; sleep 5; done
